name: Validate

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "copilot/**"
      - "templates/**"
      - "scripts/validate.py"
      - "README.md"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "agents/**"
      - "copilot/**"
      - "templates/**"
      - "scripts/validate.py"
      - "README.md"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate.py
